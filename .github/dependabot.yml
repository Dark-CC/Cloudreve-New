version: 2

# Keep updates reviewable: minor/patch bumps arrive as one grouped PR per
# ecosystem, majors are left to a human. Cloudreve pins several libraries to
# the versions its Pro/community API surface was built against, so blind major
# upgrades break the build instead of helping.
updates:
  # npm, yarn and pnpm all share the "npm" ecosystem; pnpm is selected by the
  # committed pnpm-lock.yaml plus the packageManager field in web/package.json.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # 0.x packages do not follow semver, so Dependabot treats every minor
      # bump as safe. monaco-editor 0.57 moved editor.api out of esm/vs/editor,
      # which breaks the import in MonacoEditor.tsx.
      - dependency-name: "monaco-editor"
        update-types:
          - "version-update:semver-minor"
      # pdfjs-dist also uses 0.x versioning and has renamed worker entrypoints.
      - dependency-name: "pdfjs-dist"
        update-types:
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
