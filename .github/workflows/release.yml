name: release

# The only workflow in this repository. Everything is built here, on GitHub,
# and only when a version tag is pushed. Ordinary pushes run no CI, so the
# Actions tab only ever lists releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (defaults to the selected ref)"
        required: false
      ref:
        description: "Git ref holding the source to build (defaults to the tag)"
        required: false
        default: "master"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cloudreve-new

jobs:
  binaries:
    name: Build & publish binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # `tag` selects the version, `ref` selects the source tree, so a
          # workflow fix on master can rebuild an existing tag without moving it.
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: src/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Resolve version
        id: version
        run: |
          raw="${{ inputs.tag || github.ref_name }}"
          echo "value=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Build frontend & embed assets
        working-directory: src
        env:
          npm_package_name: cloudreve-frontend
        run: |
          ./.build/build-assets.sh "${{ steps.version.outputs.value }}"

      - name: Verify embedded assets
        working-directory: src
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - <<'PY'
          import json, os, sys, zipfile
          z = zipfile.ZipFile("application/statics/assets.zip")
          names = z.namelist()
          assert any(n == "assets/build/index.html" for n in names), "assets/build/index.html missing"
          v = json.loads(z.read("assets/build/version.json"))
          print("version.json:", v)
          if v.get("name") != "cloudreve-frontend":
              sys.exit("unexpected static resource name")
          expected = os.environ["EXPECTED_VERSION"]
          if v.get("version") != expected:
              sys.exit(f"version mismatch: {v.get('version')} != {expected}")
          PY

      - name: Pre-download modules
        working-directory: src
        run: |
          go mod download
          go mod verify

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
          workdir: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & publish container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The binary and the embedded version.json must carry a bare version
      # ("4.19.2"); a leading "v" makes the server report a static resource
      # version mismatch at runtime.
      - name: Resolve version
        id: version
        run: |
          raw="${{ inputs.tag || github.ref_name }}"
          value="${raw#v}"
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          if [[ "$value" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
