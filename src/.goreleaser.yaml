version: 2

env:
  - GOFLAGS=-mod=mod
  - GO111MODULE=on

builds:
  - env:
      - CGO_ENABLED=0

    binary: cloudreve

    ldflags:
      - -s -w
      - -X 'github.com/cloudreve/Cloudreve/v4/application/constants.BackendVersion={{.Version}}'
      - -X 'github.com/cloudreve/Cloudreve/v4/application/constants.LastCommit={{.ShortCommit}}'
      - -X 'github.com/cloudreve/Cloudreve/v4/application/constants.IsPro=false'

    goos:
      - linux
      - windows
      - darwin
      - freebsd

    goarch:
      - amd64
      - arm
      - arm64
      - loong64

    goarm:
      - 5
      - 6
      - 7

    ignore:
      - goos: windows
        goarm: 5
      - goos: windows
        goarm: 6
      - goos: windows
        goarm: 7
      - goos: windows
        goarch: loong64
      - goos: freebsd
        goarch: loong64
      - goos: freebsd
        goarch: arm

archives:
  - formats: ["tar.gz"]
    # Same layout as the official releases so existing scripts keep working.
    name_template: >-
      cloudreve_{{.Version}}_{{- .Os }}_{{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE
      - NOTICE

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: Dark-CC
    name: Cloudreve-New
  draft: false
  prerelease: auto
  target_commitish: "{{ .Commit }}"
  name_template: "Cloudreve-New {{.Version}}"
  footer: |
    ## 说明

    - 本项目是基于 Cloudreve v4 社区版源码的非官方分支，遵循 GPL-3.0。
    - 不包含任何 Pro 版本的二进制、前端产物或授权逻辑。
    - 下载的压缩包内为单一静态二进制 `cloudreve`，无需额外依赖。
    - 对应源码：[{{ .Tag }}](https://github.com/Dark-CC/Cloudreve-New/tree/{{ .Tag }})

# Docker images are built by .github/workflows/docker.yml so a release does not
# fail when the registry is unavailable.
